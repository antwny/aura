name: CI & Pre-production Verification

on:
  push:
    branches: [ "main", "master", "1.7.2" ]
  pull_request:
    branches: [ "main", "master", "1.7.2" ]

env:
  CARGO_TERM_COLOR: always
  # CI checkouts are cold; incremental artifacts only add I/O and cache size.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            desktop-file-utils \
            appstream

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Validate Desktop Entry & AppStream Metadata
        run: |
          desktop-file-validate resources/io.github.antwny.aura.desktop
          appstreamcli validate --pedantic resources/io.github.antwny.aura.metainfo.xml

      - name: Cargo Check
        run: cargo check --locked --verbose

      - name: Run unit & offline integration tests
        run: cargo test --locked --verbose

      - name: Build Release Binary
        run: cargo build --release --locked --verbose
