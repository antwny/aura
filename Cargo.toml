[package]
name = "aura"
version = "1.11.1"
edition = "2021"
description = "Next-generation animated live wallpaper manager built natively in Rust for COSMIC Desktop"
authors = ["Antwny"]
license = "GPL-3.0-or-later"
repository = "https://github.com/antwny/aura"
homepage = "https://github.com/antwny/aura"
readme = "README.md"
keywords = ["wallpaper", "cosmic", "wayland", "popos", "live-wallpaper"]
categories = ["gui", "multimedia", "desktop-environment"]

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["wgpu", "tokio", "single-instance"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
open = "5.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ksni = "0.3.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
sha2 = "0.10"
tempfile = "3"
smithay-client-toolkit = { version = "0.20", features = ["calloop"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
wgpu = "28"
pollster = "0.4"
pipewire = { version = "0.9", features = ["v0_3_65"] }
bytemuck = { version = "1", features = ["derive"] }
ort = { version = "=2.0.0-rc.15", features = ["download-binaries"] }

[[bin]]
name = "aura"
path = "src/main.rs"

[[bin]]
name = "aura-effects"
path = "src/bin/aura_effects.rs"

[[bin]]
name = "aura-depth"
path = "src/bin/aura_depth.rs"

# Thumbnail tests spend most of their time inside the image/png encoder.
# Optimizing only these two packages keeps dependency build cost low while
# removing the dominant remaining cost from the test suite.
[profile.test.package.image]
opt-level = 3

[profile.test.package.png]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
