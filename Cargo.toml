[package]
name = "aura"
version = "0.1.0"
edition = "2021"
description = "Animated live wallpaper manager for Pop!_OS COSMIC"
authors = ["Antwny"]

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["wgpu", "tokio", "single-instance"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
open = "5.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
