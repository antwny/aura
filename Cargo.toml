[package]
name = "aura"
version = "1.0.1"
edition = "2021"
description = "Next-generation animated live wallpaper manager built natively in Rust for Pop!_OS COSMIC Desktop"
authors = ["Antwny"]
license = "GPL-3.0-or-later"
repository = "https://github.com/antwny/aura"
homepage = "https://github.com/antwny/aura"
readme = "README.md"
keywords = ["wallpaper", "cosmic", "wayland", "popos", "live-wallpaper"]
categories = ["gui", "multimedia", "desktop-environment"]

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", features = ["wgpu", "tokio", "single-instance"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
open = "5.3"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
ksni = "0.3.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
