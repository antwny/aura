<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="50%" stop-color="#0E111A" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>

    <!-- Subtle Inset Rim Stroke -->
    <linearGradient id="rim-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Left Pillar Gradient (Electric Cyan -> Deep Cobalt) -->
    <linearGradient id="left-shard" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Right Pillar Gradient (Cosmic Violet -> Radiant Fuchsia) -->
    <linearGradient id="right-shard" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Rounded Apex Bridge Gradient -->
    <linearGradient id="apex-bridge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Light Crossbar Gradient (Prismatic Horizon) -->
    <linearGradient id="cross-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.95" />
    </linearGradient>

    <!-- Ambient Shadow Under Monolith -->
    <radialGradient id="under-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow-base" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="shadow-monolith" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="shadow-beam" x="-25%" y="-50%" width="150%" height="220%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bg-1)" filter="url(#shadow-base)" />
  <rect x="24.5" y="24.5" width="463" height="463" rx="103.5" ry="103.5" fill="none" stroke="url(#rim-1)" stroke-width="2" />

  <circle cx="256" cy="260" r="175" fill="url(#under-glow)" />

  <g transform="translate(256, 252)">
    <g filter="url(#shadow-monolith)">
      <!-- Left Pillar Shard with rounded foot -->
      <path d="
        M -98 114
        L -34 -126
        C -30 -140 -18 -148 0 -150
        L 0 48
        L -20 48
        L -42 114
        C -45 124 -52 130 -64 130
        L -82 130
        C -92 130 -101 124 -98 114
        Z
      " fill="url(#left-shard)" />

      <!-- Right Pillar Shard with rounded foot -->
      <path d="
        M 98 114
        L 34 -126
        C 30 -140 18 -148 0 -150
        L 0 48
        L 20 48
        L 42 114
        C 45 124 52 130 64 130
        L 82 130
        C 92 130 101 124 98 114
        Z
      " fill="url(#right-shard)" />

      <!-- Smooth Rounded Apex Cap (Luminous Keystone) -->
      <path d="
        M -34 -126
        C -24 -154 24 -154 34 -126
        C 20 -110 -20 -110 -34 -126
        Z
      " fill="url(#apex-bridge)" />

      <!-- Center Aperture (Rounded Triangle) -->
      <path d="
        M 0 -40
        C 6 -40 12 -28 18 -12
        L 26 10
        C 30 18 24 26 14 26
        L -14 26
        C -24 26 -30 18 -26 10
        L -18 -12
        C -12 -28 -6 -40 0 -40
        Z
      " fill="#0E111A" />

      <!-- Subtle core reflection -->
      <path d="
        M 0 -134
        C 8 -116 12 -94 12 -74
        C 12 -64 0 -58 0 -58
        C 0 -58 -12 -64 -12 -74
        C -12 -94 -8 -118 0 -134
        Z
      " fill="#FFFFFF" opacity="0.4" />
    </g>

    <!-- Floating Horizon Crossbar -->
    <g filter="url(#shadow-beam)">
      <rect x="-123" y="44" width="246" height="32" rx="16" fill="url(#cross-beam)" />
      <rect x="-119" y="46" width="238" height="12" rx="6" fill="#FFFFFF" opacity="0.32" />
      <line x1="-105" y1="60" x2="105" y2="60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    </g>
  </g>
</svg>
